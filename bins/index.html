<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Which bins?</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#b9c8d3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f151b" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
</head>
<body>
<header>
    <h1>Which bins?</h1>
    <p id="current-date-display"></p>
</header>
<main>
    <section id="collection-info">
        <p id="next-collection-date-display" class="collection-day-emphasis"></p>
        <p id="collection-note"></p>
        <div id="bins-to-put-out">
            <!-- Bins will be dynamically added here -->
        </div>
    </section>
    <section id="update-message" style="display: none">
        <p>
            The current collection schedule has ended. Please check for an
            updated version or new timetable.
        </p>
    </section>
</main>
<footer>
    <p>Wealden District Council</p>
    <a id="calendar-subscribe" href="webcal://apps.streefland.co.uk/bins/bins.ics"
       title="Subscribe to collection reminders" aria-label="Subscribe to collection reminders">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M7 2.5v2.6M17 2.5v2.6" />
            <rect x="3.2" y="4.4" width="17.6" height="17.1" rx="3.2" />
            <path d="M3.2 9.6h17.6" />
            <circle cx="8.4" cy="14.2" r="1.25" />
            <circle cx="12" cy="14.2" r="1.25" />
            <circle cx="15.6" cy="14.2" r="1.25" />
            <circle cx="8.4" cy="18" r="1.25" />
            <circle cx="12" cy="18" r="1.25" />
        </svg>
    </a>
</footer>
<script src="schedule.js"></script>
<script src="script.js"></script>
</body>
</html>
